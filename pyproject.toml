[project]
name = "ops-agent-tradeoffs"
version = "0.1.0"
description = "Research on token efficiency, task success, and policy compliance in back-office agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "harbor==0.25.0",
    "inspect-ai==0.3.287",
    "inspect-harbor>=1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false
required-version = "==0.13.7"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
